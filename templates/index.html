<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Chatbot</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            background: linear-gradient(to right, rgb(38, 51, 61), rgb(50, 55, 65), rgb(33, 33, 78));
            font-family: 'Roboto', sans-serif;
        }
        
        .chat {
            margin-top: auto;
            margin-bottom: auto;
        }
        
        .card {
            height: 600px;
            border-radius: 15px;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }
        
        .card-header {
            border-radius: 15px 15px 0 0;
            border-bottom: 0;
            color: white;
            background-color: rgba(0, 0, 0, 0.6);
        }
        
        .msg_card_body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .card-footer {
            border-radius: 0 0 15px 15px;
            border-top: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }
        
        .type_msg {
            background-color: rgba(0, 0, 0, 0.3);
            border: 0;
            color: white;
            height: 60px;
        }
        
        .send_btn {
            border-radius: 0 15px 15px 0;
            background-color: rgba(0, 0, 0, 0.3);
            border: 0;
            color: white;
            cursor: pointer;
        }
        
        .msg_cotainer {
            margin-top: auto;
            margin-bottom: auto;
            margin-left: 10px;
            border-radius: 25px;
            background-color: rgb(82, 172, 255);
            padding: 10px;
            position: relative;
            color: white;
            max-width: 70%;
            word-wrap: break-word;
        }
        
        .msg_cotainer_send {
            margin-top: auto;
            margin-bottom: auto;
            margin-right: 10px;
            border-radius: 25px;
            background-color: #f3f344;
            padding: 10px;
            position: relative;
            color: rgb(26, 18, 18);
            max-width: 70%;
            word-wrap: break-word;
        }
        
        .msg_time,
        .msg_time_send {
            position: absolute;
            bottom: -15px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .msg_time {
            left: 0;
        }
        
        .msg_time_send {
            right: 0;
        }
        
        .dashboard {
            padding-top: 5px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .badge {
            display: inline-block;
            background: #ffd700;
            color: #000;
            padding: 5px 10px;
            border-radius: 12px;
            margin: 3px;
            font-size: 14px;
        }
        
        .img_cont,
        .img_cont_msg {
            position: relative;
        }
        
        .user_img {
            height: 70px;
            width: 70px;
            border: 1.5px solid #f5f6fa;
        }
        
        .user_img_msg {
            height: 40px;
            width: 40px;
            border: 1.5px solid #f5f6fa;
        }
        
        .online_icon {
            position: absolute;
            height: 15px;
            width: 15px;
            background-color: #4cd137;
            border-radius: 50%;
            bottom: 0.2em;
            right: 0.4em;
            border: 1.5px solid white;
        }
        
        .mood-options button {
            margin: 3px;
        }
    </style>
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-8 col-xl-6 chat">
                <div class="card">
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <div class="img_cont">
                                <img src="https://i.ibb.co/fSNP7Rz/icons8-chatgpt-512.png" class="rounded-circle user_img">
                                <span class="online_icon"></span>
                            </div>
                            <div class="user_info ml-3">
                                <span>Mental Health Chatbot</span>
                                <p>Ask me anything!</p>
                            </div>
                        </div>
                    </div>

                    <div id="messageFormeight" class="msg_card_body flex-grow-1 overflow-auto"></div>

                    <div class="card-footer">
                        <form id="messageArea" class="input-group mb-2">
                            <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required/>
                            <div class="input-group-append">
                                <button type="submit" id="send" class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></button>
                            </div>
                        </form>

                        <div class="mood-options text-center mb-2">
                            <button onclick="sendMood('Happy 😊')" class="btn btn-sm btn-success">Happy 😊</button>
                            <button onclick="sendMood('Sad 😞')" class="btn btn-sm btn-primary">Sad 😞</button>
                            <button onclick="sendMood('Anxious 😰')" class="btn btn-sm btn-warning">Anxious 😰</button>
                            <button onclick="sendMood('Tired 😴')" class="btn btn-sm btn-info">Tired 😴</button>
                            <button onclick="sendMood('Angry 😡')" class="btn btn-sm btn-danger">Angry 😡</button>
                            <button onclick="sendMood('Neutral 🙂')" class="btn btn-sm btn-secondary">Neutral 🙂</button>
                        </div>

                        <div class="dashboard">
                            <button onclick="loadDashboard()" class="btn btn-sm btn-warning mb-1">Show Mood & Badges</button>
                            <div id="moodLog" class="small text-light"></div>
                            <div id="badges" class="small text-light"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let awaitingDeepDive = false;
        let initialMoodSelected = false;
        let moodFlowActive = true;

        const moodTips = {
            "Happy 😊": "Awesome! Keep spreading positivity.\nTake a moment to appreciate yourself.\nEnjoy your day!",
            "Sad 😞": "I'm sorry to hear that.\nTry listening to your favorite music.\nTake a short walk to refresh your mind.",
            "Anxious 😰": "Take a deep breath.\nWrite down your worries.\nFocus on one task at a time.",
            "Tired 😴": "Make sure to rest and hydrate.\nShort naps can help.\nAvoid heavy work for now.",
            "Angry 😡": "Try some calming exercises.\nStep away for a few minutes.\nTalk to someone you trust.",
            "Neutral 🙂": "It's a good day to reflect.\nTry journaling your thoughts.\nEngage in a hobby you like."
        };

        function appendBotMessage(message) {
            const date = new Date();
            const hour = date.getHours();
            const minute = date.getMinutes();
            const str_time = hour + ":" + (minute < 10 ? "0" + minute : minute);

            var botHtml = '<div class="d-flex justify-content-start mb-4">' +
                '<div class="img_cont_msg"><img src="https://i.ibb.co/fSNP7Rz/icons8-chatgpt-512.png" class="rounded-circle user_img_msg"></div>' +
                '<div class="msg_cotainer">' + message.replace(/\n/g, "<br>") +
                '<span class="msg_time">' + str_time + '</span></div></div>';
            $("#messageFormeight").append(botHtml);
            $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
        }

        function appendUserMessage(message) {
            const date = new Date();
            const hour = date.getHours();
            const minute = date.getMinutes();
            const str_time = hour + ":" + (minute < 10 ? "0" + minute : minute);

            var userHtml = '<div class="d-flex justify-content-end mb-4">' +
                '<div class="msg_cotainer_send">' + message +
                '<span class="msg_time_send">' + str_time + '</span></div>' +
                '<div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg"></div></div>';
            $("#messageFormeight").append(userHtml);
            $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
        }

        async function sendMood(mood) {
            if (!moodFlowActive) return;
            initialMoodSelected = true;
            appendUserMessage(mood);
            $("#text").val("");

            appendBotMessage(moodTips[mood]);
            appendBotMessage("Do you want to dive deeper? I can help you with that. (Yes/No)");

            $(".mood-options").hide();
            awaitingDeepDive = true;
        }

        $(document).ready(function() {
            appendBotMessage("Hello! How are you feeling today? Please select a mood below or type your response.");

            $("#messageArea").on("submit", async function(event) {
                event.preventDefault();
                const rawText = $("#text").val();
                if (!rawText) return;
                $("#text").val("");
                appendUserMessage(rawText);

                if (awaitingDeepDive) {
                    if (rawText.toLowerCase() === "yes") {
                        awaitingDeepDive = false;
                        moodFlowActive = false;
                        appendBotMessage("Great! Let's continue our chat.");
                    } else {
                        awaitingDeepDive = false;
                        moodFlowActive = false;
                        appendBotMessage("Okay! You can continue chatting or select another mood next time.");
                    }
                    return;
                }

                // normal chatbot logic
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: rawText
                    })
                });
                const data = await response.json();
                appendBotMessage(data.reply);
            });
        });

        async function loadDashboard() {
            const response = await fetch('/dashboard');
            const data = await response.json();
            const moodLogDiv = document.getElementById('moodLog');
            const badgesDiv = document.getElementById('badges');
            moodLogDiv.innerHTML = '<strong>Mood Log:</strong> ' + data.mood_log.join(', ');
            badgesDiv.innerHTML = '<strong>Badges:</strong> ' + data.badges.map(b => `<span class="badge">${b}</span>`).join(' ');
        }
    </script>
</body>

</html>
